name: Setup maps-metadata scripts
inputs:
  cache-name:
    description: Name od cache
    required: true
  download-artifacts:
    description: Whatever to try to fetch pre-build artifact for usage in CI workflow
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Download artifacts
      if: ${{ inputs.download-artifacts == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: gen-artifacts
        path: gen
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version-file: scripts/py/.python-version
        cache: pip
        cache-dependency-path: scripts/py/requirements.txt
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: scripts/js/package-lock.json
    - uses: actions/cache@v6
      if: ${{ !env.ACT }}
      with:
        path: .maps-cache
        key: maps-cache-cache-v3-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: |
          maps-cache-cache-v3-${{ inputs.cache-name }}-
    - name: Install dependencies
      shell: bash
      run: ./scripts/install.sh
