[project]
name = 'map_syncer'
version = '0.0.1'
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyfakefs>=6.3.2",
    "pytest>=9.2.0",
    "pytest-httpserver>=1.2.0",
    "pytest-mock>=3.17.0",
    "pytest-mqtt>=0.7.1",
    "ruff>=0.17.4",
]

[tool.mypy]
files = "*.py"
pretty = true
show_error_context = true

strict = true
disallow_any_expr = true
enable_error_code = ["ignore-without-code"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "C90", "N", "UP", "YTT", "B", "A", "C4", "EM", "ISC",
    "G", "RUF", "PIE", "SIM", "PTH", "PLC", "PLE", "PLW"
]
